name: Test and Deploy Shell Runner

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/LAST_SUCCESSFUL_DEPLOY.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shell-runner-pages
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize runtime and apply gameplay enhancements
        run: npm run sync-runtime
      - name: Persist materialized migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html source.html assets
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Shell Runner source and assets"
            git push origin HEAD:main
          fi
      - name: Install reproducibly
        run: npm ci
      - name: Smoke tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages runtime
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          deployed_sha="$(git rev-parse HEAD)"
          live_ok=0
          for attempt in $(seq 1 12); do
            rm -f /tmp/live-shell-runner.html
            if curl -fsSL --max-time 20 "${PAGE_URL}" -o /tmp/live-shell-runner.html \
              && grep -Fq 'Shell Runner boss progression + roster v3.0' /tmp/live-shell-runner.html \
              && grep -Fq 'const BOSS_CORRECT_INTERVAL=10;' /tmp/live-shell-runner.html \
              && grep -Fq 'const BOSS_MAX_HP=10;' /tmp/live-shell-runner.html \
              && grep -Fq 'bossRosterTrack' /tmp/live-shell-runner.html \
              && grep -Fq 'bossAbilityName' /tmp/live-shell-runner.html \
              && grep -Fq 'tapLaneFromPoint' /tmp/live-shell-runner.html \
              && grep -Fq 'bossQuestionSafeUntil' /tmp/live-shell-runner.html; then
              live_ok=1
              break
            fi
            sleep 5
          done
          test "$live_ok" -eq 1
          printf '%s\n' "$deployed_sha" > /tmp/deployed_sha
      - name: Record successful deployment evidence
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          deployed_sha="$(cat /tmp/deployed_sha)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p docs
          cat > docs/LAST_SUCCESSFUL_DEPLOY.md <<EOF
          # Last successful Shell Runner deployment

          - deployed_sha: \`$deployed_sha\`
          - page_url: $PAGE_URL
          - live_smoke: PASS
          - checked_features: 10-word boss progression + 10 HP bosses + ability intro + boss roster + top pause + boss fairness + lower-field tap/click lane control
          - runtime_marker: Shell Runner boss progression + roster v3.0
          - verified_at_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          git add docs/LAST_SUCCESSFUL_DEPLOY.md
          if ! git diff --cached --quiet; then
            git commit -m "Record successful Shell Runner deployment [skip ci]"
            git push origin HEAD:main
          fi
