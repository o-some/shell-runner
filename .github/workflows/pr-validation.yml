name: Validate Shell Runner PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reproducibly
        run: npm ci
      - name: Materialize runtime
        run: npm run sync-runtime
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Observe deployed Pages runtime
        run: |
          set -euo pipefail
          body="$(curl -fsSL --max-time 20 https://o-some.github.io/shell-runner/)"
          printf '%s' "$body" | grep -Fq 'Shell Runner boss progression + roster v3.0'
          printf '%s' "$body" | grep -Fq 'const BOSS_CORRECT_INTERVAL=10;'
          printf '%s' "$body" | grep -Fq 'const BOSS_MAX_HP=10;'
          printf '%s' "$body" | grep -Fq 'bossRosterTrack'
          printf '%s' "$body" | grep -Fq 'bossAbilityName'
          echo 'Public Pages runtime contains Shell Runner boss progression v3 markers.'
