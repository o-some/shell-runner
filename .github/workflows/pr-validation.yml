name: Validate Shell Runner PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reproducibly
        run: npm ci
      - name: Materialize runtime
        run: npm run sync-runtime
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
