task: caf-boss-fairness-tap-control
allowed:
  - scripts/apply-input-fairness.mjs
  - package.json
  - tests/input-fairness.test.mjs
  - HANDOFF.md
  - .masterbrain/game-design.yml
  - .masterbrain/impact-scope.yml
protected:
  - source.html
  - assets/bosses/*
  - assets/characters/*
  - scripts/materialize.mjs
  - scripts/apply-dropbox-bosses.mjs
  - scripts/apply-boss-gameplay-polish.mjs
  - scripts/apply-tula-reaction-sprites.mjs
  - scripts/apply-boss-frequency.mjs
  - scripts/apply-meta-gameplay.mjs
  - scripts/apply-boss-unique-mechanics.mjs
  - scripts/apply-post-boss-choices.mjs
  - scripts/apply-release-polish.mjs
  - o-some/tulasisland
  - all other game repositories
rules:
  refactor_outside_scope: false
  force_push: false
  direct_main_write: false
  preserve_existing_gameplay_unless_explicitly_extended: true
  source_snapshot_read_only: true
  runtime_changes_via_final_enhancer_only: true
